{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar producto - Estación de Guitarras</title>
    <link rel="stylesheet" href="{% static 'tienda/style.css' %}">
    <link rel="stylesheet" href="{% static 'tienda/auth.css' %}">
</head>
<body>
    <header>
        <div class="header-logo-container">
            <img src="{% static 'tienda/image_028521.jpg' %}" alt="Logo Estación de Guitarras" class="logo-img">
            <h1>ESTACIÓN DE GUITARRAS</h1>
        </div>
        {% include 'tienda/_cuenta.html' %}
    </header>

    <main class="auth-main">
        <div class="auth-card">
            <h2>Eliminar producto</h2>

            <img src="{{ producto.imagen_url }}" alt="{{ producto.nombre }}"
                 style="display: block; max-width: 100%; max-height: 200px; margin: 0 auto 16px; object-fit: contain; border-radius: 6px;">

            <p style="color: #ccc; text-align: center;">
                ¿Seguro que quieres eliminar <strong>{{ producto.nombre }}</strong>?
            </p>
            <p class="auth-error" style="text-align: center;">Esta acción no se puede deshacer.</p>

            <form method="post" action="{% url 'producto_eliminar' producto.pk %}">
                {% csrf_token %}
                <button type="submit" class="auth-btn" style="background-color: #424242;">Sí, eliminar</button>
            </form>

            <a href="{% url 'productos_gestionar' %}?accion=eliminar" class="auth-btn auth-btn-secundario">Cancelar</a>
        </div>
    </main>
</body>
</html>
